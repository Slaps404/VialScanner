name: Vyals
options:
  bundleIdPrefix: com.lab.vyals
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "442W83T52T"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VialCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/VialCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.vyals.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        GENERATE_INFOPLIST_FILE: YES

  Vyals:
    type: application
    platform: iOS
    dependencies:
      - target: VialCore
        embed: true
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lab.vyals
        PRODUCT_NAME: Vyals
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera reads vial labels and barcodes to identify antibodies against the lab inventory."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Scan clips are recorded without audio; the microphone is never used."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save a scan clip to your photo library."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
